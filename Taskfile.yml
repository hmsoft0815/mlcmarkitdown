version: '3'

# Replaces the previous Makefile, which held the same targets plus two the
# Taskfile lacked (test:integration, test:ollama). Keeping both would have
# meant two places to change and one of them going stale.

vars:
  BINARY: mlc-markitdown
  BIN_DIR: bin
  MODULE: github.com/hmsoft0815/mlcmarkitdown
  VERSION:
    sh: cat VERSION
  # Without this the binary reports "dev". The old build passed no ldflags at
  # all, so the version was a constant pretending to be configurable.
  LDFLAGS: -X main.version={{.VERSION}}

tasks:
  default:
    desc: List the available tasks
    cmds: [task --list]
    silent: true

  build:
    desc: Build the MCP server with the version stamped in
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.BINARY}} ./cmd/server

  dev:
    desc: Run the server from source
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/server {{.CLI_ARGS}}

  test:
    desc: Run the unit tests
    cmds: [go test ./...]

  test:integration:
    desc: Drive the built server through mcp-tester
    deps: [build]
    cmds:
      - |
        command -v mcp-tester >/dev/null 2>&1 || \
          go install github.com/hmsoft0815/mlc_mcptester/cmd/mcp-tester@latest
        mcp-tester test -c "{{.BIN_DIR}}/{{.BINARY}}" --script tests/integration.mcp

  test:ollama:
    desc: Exercise the Ollama vision/audio path against a live model
    deps: [build]
    cmds:
      - |
        command -v mcp-tester >/dev/null 2>&1 || \
          go install github.com/hmsoft0815/mlc_mcptester/cmd/mcp-tester@latest
        ./test-ollama.sh

  lint:
    desc: gofmt check, go vet and golangci-lint
    cmds:
      - |
        unformatted=$(gofmt -l . | grep -v '^$' || true)
        if [ -n "$unformatted" ]; then
          echo "gofmt would change:"; echo "$unformatted"; exit 1
        fi
        echo "gofmt: clean"
      - go vet ./...
      - golangci-lint run

  fmt:
    desc: Format the source
    cmds: [go fmt ./...]

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t {{.BINARY}} .

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BIN_DIR}}
